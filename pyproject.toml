[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-genre-classifier"
version = "0.1.0"
description = "Reproducible modelling pipeline."
authors = [{name = "Ozan Safak Kocak"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.13.5",
    "joblib==1.5.2",
    "numpy==2.3.3",
    "pandas==2.3.2",
    "requests==2.32.5",
    "scikit-learn==1.6.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "streamlit>=1.40,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
